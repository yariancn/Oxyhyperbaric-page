name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-workers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy oxyhyperbaric-page
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Worker
        env:
          TOKEN_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TOKEN_VAR: ${{ vars.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ACCOUNT_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          CLOUDFLARE_API_TOKEN="${TOKEN_SECRET:-$TOKEN_VAR}"
          CLOUDFLARE_ACCOUNT_ID="${ACCOUNT_SECRET:-$ACCOUNT_VAR}"
          CLOUDFLARE_ACCOUNT_ID="${CLOUDFLARE_ACCOUNT_ID:-a0d6591fc135a7069b2487a1f5fd5aa7}"
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Falta CLOUDFLARE_API_TOKEN. Agrégalo en GitHub → Settings → Secrets and variables → Actions (tab Secrets o Variables)."
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx wrangler@4 deploy
