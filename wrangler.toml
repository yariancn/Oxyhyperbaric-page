# Static site deploy for Cloudflare Workers (Git → npx wrangler deploy)
name = "oxyhyperbaric-page"
compatibility_date = "2026-06-10"
main = "_worker.js"

# Funnel lead notifications — set in Dashboard → Settings → Variables:
# FUNNEL_LEAD_SECRET (required for SMS via oxy-agenda + lead store in Predictacore Ads)
# PREDICTACORE_OXY_LEADS_URL (optional; default https://predictacore.ai/ads/api/oxy/funnel-leads)
# OXY_AGENDA_FOLLOWUP_CRON_URL (optional; default https://oxy-agenda.vercel.app/api/cron/funnel-lead-followup)
# LEAD_WEBHOOK_URL, WELLNESS_ORIGIN
# Staff SMS is deferred (~20 min) only if the lead does not book.

[triggers]
crons = ["*/10 * * * *"]

[assets]
directory = "."
binding = "ASSETS"
